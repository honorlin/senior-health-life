brand:
  name: 樂齡好生活
  tagline: 50歲後，看得懂、做得到的健康生活指南
  promise: 把複雜健康資訊，整理成每天可以實踐的小行動。
  mission: 分享清楚可靠且有溫度的資訊，關心身體健康、心理感受、陪伴與生活樂趣，幫助台灣樂齡長輩身心健康、心情快樂，讓家庭更安心、台灣更健康有力量。
  core_belief: 愉快而安定的心情，是身心健康很重要的一部分；健康不只有身體，也包含心理、關係與生活的幸福感。
  supporter: 台記生技支持
audience:
  primary: 50至75歲熟齡族
  secondary: 40至60歲、關心父母生活的家庭照顧者
tone:
  - 溫暖
  - 清楚
  - 不製造焦慮
  - 不責備
  - 不誇大
  - 使用繁體中文與台灣用語
design:
  palette: 溫暖陽光黃
  primary: "#8a5a00"
  secondary: "#fff4c7"
  accent: "#e5a000"
  ink: "#332a1d"
  background: "#fffcf2"
  line: "#ebdfaf"
  body_font_min_px: 19
  line_height: 1.8
categories:
  - key: nutrition
    name: 每日好營養
    description: 一般飲食、營養素與食品標示
  - key: movement
    name: 熟齡好活動
    description: 散步、伸展、平衡與日常活動
  - key: sleep
    name: 一夜好睡眠
    description: 睡眠環境與生活節奏
  - key: safety
    name: 安心好生活
    description: 居家防跌、外出與生活安全
  - key: supplements
    name: 保健品知識
    description: 成分與標示閱讀，不做療效宣稱
  - key: family
    name: 關心父母
    description: 陪伴、溝通與照顧者實用指南
