version: 1
auto_publish:
  allowed_risk_levels: [green, blue]
  minimum_sources: 2
  require_approved_domain: true
  maximum_posts_per_day: 1
  minimum_images_per_post: 3
image_policy:
  real_photo_priority: true
  target_real_photos_per_post: 3
  require_local_copy: true
  forbid_hotlinking: true
  allowed_license_examples: [CC0, CC-BY, CC-BY-SA, explicit_written_permission]
  require_photo_credits: [creator, source_url, license_name, license_url, modifications]
  allowed_edits: [responsive_crop, straighten, exposure, contrast, color_correction, light_sharpening, web_compression]
  forbidden_edits: [misleading_object_change, person_addition_or_removal, altered_safety_condition, falsified_landmark_detail]
  required:
    cover_images: 1
    inline_images: 2
  directory: assets/images/posts
  cover_viewbox: "0 0 1200 630"
  inline_viewbox_allowed: ["0 0 1200 800", "0 0 1200 630"]
  require_traditional_chinese_alt: true
  require_caption: true
  atomic_publish_with_post: true
  forbidden_svg_elements: [script, foreignObject]
  forbidden_content: [external_url, embedded_raster, base64, third_party_logo, real_person_likeness, treatment_claim]
editorial_scope:
  required_dimensions: [食, 衣, 住, 行, 育, 樂, 活動, 睡眠, 心情, 陪伴, 保健知識, 數位安全]
  balance_window_days: 30
  selection_rule: 優先選擇最近30天文章數較少的安全分類，避免連續重複同一分類
risk_levels:
  green:
    examples: [舒適穿著, 居家安全, 交通準備, 終身學習, 休閒興趣, 睡眠環境, 心情照顧, 陪伴溝通, 數位防詐]
  blue:
    examples: [一般營養知識, 食品標示閱讀, 低強度日常活動, 保健品標示知識]
  yellow:
    auto_publish: false
    examples: [慢性病, 藥物交互作用, 腎臟病飲食, 個別營養量]
  red:
    auto_publish: false
    examples: [診斷, 治療, 停藥換藥, 急症判斷, 食品療效]
blocked_phrases:
  - 治療
  - 根治
  - 抗癌
  - 降血糖
  - 降血壓
  - 清血管
  - 修復腎臟
  - 取代藥物
  - 停藥
  - 無副作用
  - 保證有效
  - 立即見效
required_sections:
  - 30秒看懂
  - 今天可以怎麼做
  - 哪些情況要先詢問專業人員
  - 參考資料
commercial_policy:
  automatic_product_recommendations: false
  maximum_commercial_ratio: 0.2
