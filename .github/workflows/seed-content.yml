name: Seed safe content backfill
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Optional category key to backfill"
        required: false
        type: choice
        options:
          - ""
          - nutrition
          - clothing
          - safety
          - mobility
          - learning
          - leisure
          - movement
          - sleep
          - wellbeing
          - family
          - supplements
          - digital
      target_per_category:
        description: "Target posts per category"
        required: true
        default: "2"
      max_new:
        description: "Maximum new posts this run; keep small to avoid image/API rate limits"
        required: true
        default: "3"
      fresh:
        description: "Generate fresh target_per_category posts even if category already has posts"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: seed-content
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate bounded seed batch
        id: seed
        shell: bash
        run: |
          args=(--target-per-category "${{ inputs.target_per_category }}" --max-new "${{ inputs.max_new }}")
          if [ -n "${{ inputs.category }}" ]; then
            args+=(--category "${{ inputs.category }}")
          fi
          if [ "${{ inputs.fresh }}" = "true" ]; then
            args+=(--fresh)
          fi
          python scripts/seed_backfill.py "${args[@]}"
      - name: Validate generated posts and images
        shell: bash
        run: |
          mapfile -t posts < <(git diff --name-only -- '_posts/*.md')
          if [ ${#posts[@]} -eq 0 ]; then
            echo "No generated post to validate."
            exit 1
          fi
          python scripts/validate_content.py "${posts[@]}"
      - uses: actions/configure-pages@v5
      - name: Build site before publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Commit approved seed posts and images
        shell: bash
        run: |
          git config user.name "senior-health-life-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts assets/images/posts
          if git diff --cached --quiet; then
            echo "No safe seed posts to publish."
            python scripts/operations_report.py --status blocked --reason "no approved seed post or image set"
            exit 0
          fi
          git commit -m "content: seed senior-life category articles"
          git push
          python scripts/operations_report.py --status published
      - uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: seed
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed site and post images
        run: python3 scripts/verify_deploy.py "${{ steps.deployment.outputs.page_url }}"
