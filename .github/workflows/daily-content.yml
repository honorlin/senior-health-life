name: Daily safe content
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-content
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate one low-risk article
        run: python scripts/generate_article.py
      - name: Validate generated article(s) and image licenses
        run: |
          mapfile -t posts < <(git diff --name-only -- '_posts/*.md')
          if [ ${#posts[@]} -eq 0 ]; then
            echo "No generated post to validate."
            exit 1
          fi
          python scripts/validate_content.py "${posts[@]}"
      - uses: actions/configure-pages@v5
      - name: Build site before publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Commit approved article and images
        run: |
          git config user.name "senior-health-life-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts assets/images/posts
          if git diff --cached --quiet; then
            echo "No safe article to publish."
            python scripts/operations_report.py --status blocked --reason "no approved article or image set"
            exit 0
          fi
          git commit -m "content: publish daily reviewed article"
          git push
          python scripts/operations_report.py --status published
      - uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed site and post images
        run: python3 scripts/verify_deploy.py "${{ steps.deployment.outputs.page_url }}"
