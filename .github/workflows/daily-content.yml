name: Daily content operations check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-content-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate published articles
        run: python scripts/validate_content.py
      - name: Operations report
        run: python scripts/operations_report.py --format json
